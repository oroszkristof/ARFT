<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vízió</title>
    <style>
        p {
            font-size: 25px;
        }
        h1 {
            text-align: center;
        }
        .center {
            text-align: center;
        }
        table {
            text-align: center;
            font-size: 20px;
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }
        .center2 {
            text-align: right;
        }
        .bottom-left {
            position: fixed;
            bottom: 20px;
            left: 40%;
            transform: translateX(-50%);
            text-align: center;
            display: none;
        }
        .bottom-left a {
            text-decoration: none;
            color: black;
            font-size: 30px;
        }
        .bottom-left span {
            display: block;
            font-size: 16px;
        }
        .bottom-center {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            display: none;
        }
        .bottom-center a {
            text-decoration: none;
            color: black;
            font-size: 30px;
        }
        .bottom-center span {
            display: block;
            font-size: 16px;
        }
        .bottom-right {
            position: fixed;
            bottom: 20px;
            left: 60%;
            transform: translateX(-50%);
            text-align: center;
            display: none;
        }
        .bottom-right a {
            text-decoration: none;
            color: black;
            font-size: 30px;
        }
        .bottom-right span {
            display: block;
            font-size: 16px;
        }
        .visible {
            display: block;
        }
        
        @media (max-width: 600px) {
            p {
                font-size: 18px;
            }
            table {
                font-size: 16px;
            }
            .bottom-left a,
            .bottom-center a,
            .bottom-right a {
                font-size: 24px;
            }
            .bottom-left span,
            .bottom-center span,
            .bottom-right span {
                font-size: 14px;
            }
            .bottom-left {
                left: 35%;
            }
            .bottom-right {
                left: 65%;
            }
        }
    </style>
</head>
<body>


    <div class="bottom-left">
        <a href="tartalomjegyzek.html">◀</a>
        <span>Előző oldal</span>
    </div>

    <div class="bottom-center">
        <a href="tartalomjegyzek.html">📋</a>
        <span>Tartalomjegyzék</span>
    </div>

    <div class="bottom-right">
        <a href="bevezetes.html">▶</a>
        <span>Következő oldal</span>
    </div>

    <script>
        const prevButton = document.querySelector('.bottom-left');
        const tartalomLink = document.querySelector('.bottom-center');
        const nextButton = document.querySelector('.bottom-right');

        window.addEventListener('scroll', () => {
            const scrollPosition = window.scrollY + window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;

            if (scrollPosition >= documentHeight - 50) {
                prevButton.classList.add('visible');
                tartalomLink.classList.add('visible');
                nextButton.classList.add('visible');
            } else {
                prevButton.classList.remove('visible');
                tartalomLink.classList.remove('visible');
                nextButton.classList.remove('visible');
            }
        });
    </script>

</body>
</html>
